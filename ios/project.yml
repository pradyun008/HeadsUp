name: HeadsUp
options:
  bundleIdPrefix: org.headsup
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Build.xcconfig
  Release: Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  HeadsUp:
    type: application
    platform: iOS
    sources:
      - path: HeadsUp
        excludes:
          - Tests
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEADSUP_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: HeadsUp/App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
