# Generates HeadsUp.xcodeproj. Run: xcodegen generate
name: HeadsUp
options:
  bundleIdPrefix: com.romanstash
  deploymentTarget:
    iOS: "17.2" # Meta DAT requires 17.2
  createIntermediateGroups: true
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V9ZA4NRGGY
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HeadsUp:
    type: application
    platform: iOS
    sources:
      - HeadsUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanstash.headsup
        # Developer Mode: no Meta app ID or client token needed (empty = skip attestation).
        META_APP_ID: ""
        CLIENT_TOKEN: ""
    info:
      path: HeadsUp/Info.plist
      properties:
        CFBundleDisplayName: HeadsUp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [headsup]
        # Meta Wearables Device Access Toolkit (per build-integration-ios docs).
        MWDAT:
          AppLinkURLScheme: "headsup://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Meta glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        # Lets clips be copied in and recordings copied out through Finder / the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: The phone camera can stand in for the glasses camera.
        NSLocationWhenInUseUsageDescription: Your position is used to speak walking directions.
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMockDevice
  HeadsUpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HeadsUpTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HeadsUp
schemes:
  HeadsUp:
    build:
      targets:
        HeadsUp: all
        HeadsUpTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HeadsUpTests]
